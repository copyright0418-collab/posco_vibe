<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sonic Mood | 취향 기반 음악 추천</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#101010;--surface:#1c1c1c;--surface2:#282828;--text:#f7f4f2;--muted:#aaa2a0;--red:#ff4435;--pink:#ffb4a8;--line:#ffffff14}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 86% -10%,#451b24 0,transparent 27%),var(--bg);color:var(--text);font-family:Hanken Grotesk,'Noto Sans KR',sans-serif}.app{max-width:1440px;margin:auto;padding:28px 48px 110px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:62px}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand i{display:inline-block;background:var(--red);width:10px;height:10px;border-radius:50%;margin-right:8px}.top-note{color:var(--muted);font-size:14px}h1{font-size:clamp(38px,5vw,66px);letter-spacing:-2.8px;line-height:1.02;margin:0 0 17px;max-width:760px}.intro{font-size:18px;color:var(--muted);margin:0 0 37px}.moodbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:58px}.chip{border:1px solid var(--line);background:#242323;color:#d8d2d0;border-radius:99px;padding:9px 14px;font:600 13px inherit;cursor:pointer;transition:.2s}.chip:hover,.chip.active{background:#fff;color:#191919;border-color:#fff}.section-title{font-size:23px;margin:0 0 8px}.section-desc{color:var(--muted);margin:0 0 20px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:linear-gradient(145deg,#242323,#181818);border:1px solid var(--line);border-radius:19px;padding:14px;transition:transform .25s,box-shadow .25s}.card:hover{transform:translateY(-5px);box-shadow:0 16px 38px #0008}.cover{height:205px;border-radius:13px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:18px;background:var(--cover)}.cover:before{content:'';position:absolute;inset:0;background:linear-gradient(130deg,#ffffff27,transparent 50%,#0008)}.cover:after{content:'♫';position:absolute;right:16px;top:9px;font-size:72px;font-weight:700;color:#ffffff25}.genre-label{position:relative;font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;background:#0007;padding:6px 9px;border-radius:99px}.song{margin:15px 2px 6px;font-size:21px;line-height:1.1;letter-spacing:-.5px;cursor:pointer}.artist{margin:0 2px 13px;color:var(--pink);font-size:15px;font-weight:600;cursor:pointer;width:max-content}.artist:hover,.song:hover{text-decoration:underline}.reason{background:#0f0f0f;border:1px solid var(--line);color:#c9c2c0;border-radius:10px;min-height:72px;padding:11px;font:13px/1.45 'Noto Sans KR',sans-serif}.reason b{font-family:Hanken Grotesk;color:var(--red);font-size:11px;letter-spacing:.7px;display:block;margin-bottom:4px}.actions{display:flex;gap:9px;margin-top:13px}.btn{border:0;border-radius:9px;padding:11px 13px;font:700 13px inherit;cursor:pointer;transition:.2s}.youtube{background:#f20d0d;color:white;flex:1}.youtube:hover{background:#ff5047}.save{background:var(--surface2);color:#ddd}.save.saved{background:#1a8d53;color:#fff}.more{margin:57px 0 0;padding:27px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(100deg,#25191a,#1b1b1b);display:flex;align-items:center;justify-content:space-between;gap:25px}.more h2{margin:0 0 6px;font-size:25px}.more p{margin:0;color:var(--muted)}.recommend{background:var(--red);color:#fff;padding:14px 19px;white-space:nowrap}.recommend:hover{background:#ff6b60}.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:20px;z-index:3}.modal.open{display:grid}.dialog{width:min(560px,100%);background:#202020;border:1px solid #ffffff1f;border-radius:20px;padding:26px;box-shadow:0 20px 60px #000}.dialog-head{display:flex;justify-content:space-between;align-items:start}.dialog h2{margin:0;font-size:27px}.dialog p{color:var(--muted);margin-top:7px}.close{background:transparent;color:#fff;border:0;font-size:27px;cursor:pointer}.artist-list{display:grid;gap:9px;margin-top:22px}.artist-song{display:flex;justify-content:space-between;align-items:center;padding:13px;border-radius:10px;background:#151515;border:1px solid var(--line);cursor:pointer}.artist-song:hover{border-color:var(--red)}.artist-song span{color:var(--muted);font-size:13px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,90px);opacity:0;background:#fff;color:#111;padding:12px 17px;border-radius:99px;font-weight:700;transition:.25s;z-index:4}.toast.show{transform:translate(-50%,0);opacity:1}@media(max-width:800px){.app{padding:22px 18px 90px}header{margin-bottom:46px}.top-note{display:none}.grid{grid-template-columns:1fr}.cover{height:230px}.more{align-items:flex-start;flex-direction:column;margin-top:40px}h1{letter-spacing:-1.8px}}
  </style>
</head>
<body>
<main class="app">
  <header><div class="brand"><i></i>Sonic Mood</div><div class="top-note">오늘의 기분으로 발견하는 새로운 사운드</div></header>
  <section><h1>지금의 당신에게<br>가장 잘 어울리는 노래</h1><p class="intro">편안한 오후 · 감성적인 인디와 R&B · 낮은 에너지</p><div class="moodbar" id="genres"><button class="chip active" data-genre="전체">전체</button><button class="chip" data-genre="R&B">R&B</button><button class="chip" data-genre="인디">인디</button><button class="chip" data-genre="K-pop">K-pop</button><button class="chip" data-genre="Lo-fi">Lo-fi</button><button class="chip" data-genre="팝">팝</button></div></section>
  <section><h2 class="section-title" id="listTitle">오늘의 맞춤 추천</h2><p class="section-desc" id="listDesc">노래를 누르면 YouTube에서 바로 감상할 수 있고, 가수를 누르면 같은 아티스트의 추천곡을 볼 수 있어요.</p><div class="grid" id="songGrid"></div></section>
  <section class="more"><div><h2>비슷한 장르를 더 탐색해 볼까요?</h2><p>선택한 장르를 바탕으로 새로운 6곡을 랜덤하게 추천해 드립니다.</p></div><button class="btn recommend" id="moreBtn">새 추천 받기 ✦</button></section>
</main>
<div class="modal" id="modal" aria-modal="true" role="dialog"><div class="dialog"><div class="dialog-head"><div><h2 id="modalName"></h2><p>이 아티스트의 다른 추천곡</p></div><button class="close" id="closeBtn" aria-label="닫기">×</button></div><div class="artist-list" id="artistList"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const songs=[
 {t:'Love Lee',a:'AKMU',g:'K-pop',r:'부드러운 리듬과 따뜻한 멜로디가 느긋한 오후의 공기와 자연스럽게 어울려요.',c:'linear-gradient(135deg,#d05b47,#3c1430)',x:['후라이의 꿈','낙하','시간과 낙엽']},
 {t:'Get You',a:'Daniel Caesar',g:'R&B',r:'여백이 느껴지는 보컬과 잔잔한 기타가 차분한 감정선을 오래 이어 줍니다.',c:'linear-gradient(135deg,#be8e53,#28322e)',x:['Best Part','Japanese Denim','Always']},
 {t:'밤편지',a:'아이유',g:'K-pop',r:'낮은 온도의 어쿠스틱 사운드가 조용히 쉬고 싶은 지금의 분위기를 닮았어요.',c:'linear-gradient(135deg,#374a91,#c77872)',x:['이름에게','팔레트','드라마']},
 {t:'Every Summertime',a:'NIKI',g:'팝',r:'빈티지한 드럼과 포근한 톤이 편안하면서도 기분 좋은 설렘을 더합니다.',c:'linear-gradient(135deg,#f0a867,#a64253)',x:['La La Lost You','Lowkey','Backburner']},
 {t:'Dancing in the Moonlight',a:'Toploader',g:'인디',r:'가볍게 흘러가는 기타와 밝은 코러스가 일상에 작은 활력을 더해 줘요.',c:'linear-gradient(135deg,#e5aa35,#173850)',x:['Achilles Heel','Only for a While','Time of My Life']},
 {t:'Coffee',a:'beabadoobee',g:'Lo-fi',r:'가까이 속삭이는 듯한 보컬과 로파이 질감이 혼자만의 휴식 시간에 잘 맞습니다.',c:'linear-gradient(135deg,#5d8f75,#473a57)',x:['Glue Song','Talk','The Perfect Pair']},
 {t:'Sunday Morning',a:'Maroon 5',g:'팝',r:'부드러운 그루브와 햇살 같은 멜로디로 가벼운 산책에 잘 어울리는 곡입니다.',c:'linear-gradient(135deg,#78a0c4,#35513d)',x:['She Will Be Loved','Memories','Sugar']},
 {t:'어떻게 이별까지 사랑하겠어, 널 사랑하는 거지',a:'AKMU',g:'K-pop',r:'섬세하게 쌓이는 편곡과 서정적인 보컬이 감정의 깊이를 편안하게 건드립니다.',c:'linear-gradient(135deg,#854758,#17283a)',x:['200%','DINOSAUR','Give Love']},
 {t:'Best Part',a:'Daniel Caesar',g:'R&B',r:'느슨한 네오소울 리듬이 지친 마음을 다독이는 포근한 휴식 같은 사운드예요.',c:'linear-gradient(135deg,#b45e62,#573d25)',x:['Get You','Cyanide','Valentina']}
];
let current='전체', pool=[...songs]; const grid=document.querySelector('#songGrid');
function yt(q){window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q),'_blank','noopener')}
function render(){let view=current==='전체'?pool:pool.filter(s=>s.g===current); if(!view.length)view=songs.filter(s=>s.g===current); grid.innerHTML=view.slice(0,6).map((s,i)=>`<article class="card"><div class="cover" style="--cover:${s.c}"><span class="genre-label">${s.g}</span></div><h3 class="song" data-y="${i}">${s.t}</h3><p class="artist" data-a="${i}">${s.a}</p><div class="reason"><b>WHY THIS TRACK</b>${s.r}</div><div class="actions"><button class="btn youtube" data-y="${i}">▶ YouTube에서 듣기</button><button class="btn save" data-save="${i}" aria-label="저장">♡</button></div></article>`).join(''); grid.querySelectorAll('[data-y]').forEach(el=>el.onclick=()=>yt(view[el.dataset.y].t+' '+view[el.dataset.y].a));grid.querySelectorAll('[data-a]').forEach(el=>el.onclick=()=>openArtist(view[el.dataset.a]));grid.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{b.classList.toggle('saved');b.textContent=b.classList.contains('saved')?'✓':'♡';toast(b.classList.contains('saved')?'내 라이브러리에 저장했어요.':'저장을 취소했어요.')});}
function openArtist(s){document.querySelector('#modalName').textContent=s.a;document.querySelector('#artistList').innerHTML=s.x.map(t=>`<div class="artist-song" data-q="${t} ${s.a}"><strong>${t}</strong><span>YouTube에서 듣기 ↗</span></div>`).join('');document.querySelector('#artistList').querySelectorAll('[data-q]').forEach(x=>x.onclick=()=>yt(x.dataset.q));document.querySelector('#modal').classList.add('open')}
function toast(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
document.querySelector('#genres').onclick=e=>{if(!e.target.matches('.chip'))return;document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');current=e.target.dataset.genre;document.querySelector('#listTitle').textContent=current==='전체'?'오늘의 맞춤 추천':current+' 감성 추천';document.querySelector('#listDesc').textContent=current==='전체'?'노래를 누르면 YouTube에서 바로 감상할 수 있고, 가수를 누르면 같은 아티스트의 추천곡을 볼 수 있어요.':current+' 장르의 여러 곡을 골라봤어요. 다른 장르도 자유롭게 탐색해 보세요.';render()};
document.querySelector('#moreBtn').onclick=()=>{pool=[...songs].sort(()=>Math.random()-.5);current='전체';document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.genre==='전체'));document.querySelector('#listTitle').textContent='새롭게 고른 비슷한 분위기의 추천';render();toast('새로운 추천곡을 준비했어요 ✦');window.scrollTo({top:300,behavior:'smooth'})};document.querySelector('#closeBtn').onclick=()=>document.querySelector('#modal').classList.remove('open');document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};render();
</script>
</body></html>
